# Casbin 模型：整套鉴权只有「角色 → 具名权限」一条关系。
#
# 为什么不用 Casbin 的 g（RBAC 继承）：
#
#   g, admin, leader 这种写法把权限表达成「继承链」，看起来省事，实际有两个
#   致命问题：
#     1. 一配错就是越权，而且没有任何提示。少写一行 g 某角色凭空多出一堆权限，
#        策略文件读起来仍然完全正常。
#     2. 它和本项目的需求天然冲突——负责人（leader）的权限比管理员（admin）
#        小。继承链只能表达「小的继承大的」，表达不了「大的反而更小」。
#
#   显式清单一屏看完，「负责人到底能干什么」不用在脑子里推导继承链。
#   代价是新加权限时要逐个角色补行：漏补的表现是「该角色少一项能力」
#   （安全侧，出错时立刻有人喊），而不是「某角色多了一项能力」（危险侧）。
#
# 为什么没有 [role_definition]：没有 g，matcher 里也就不会出现 g()。
# 留着这段声明只会让人以为可以往里加继承。

[request_definition]
# sub = 角色名（users.role 的原始值，不是等级，也不是用户 ID）
# obj = 具名权限，如 project.member
r = sub, obj

[policy_definition]
p = sub, obj

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# 全等匹配，不做通配。两个字段、一个「与」、零个函数。
#
# 不用 keyMatch 是有意的：权限名带点（project.member、switch.operate），
# 而 keyMatch 把「/foo/*」当模式解释，keyMatch2 更会按 :param 拆路径——
# 权限名一旦被当成路径模式，project.member 这类名字将来很容易意外匹配上
# 别的策略，而且这种错不会有任何报错。
#
# 鉴权表达式越简单越好：它会被逐行 review，而 review 的人无法执行它。
m = r.sub == p.sub && r.obj == p.obj
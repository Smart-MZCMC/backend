name: CI

# 后端：Go 1.25 + Goravel。
#
# 关键点：后端不托管前端源码，而是托管三个静态站点产物
# （public/admin、public/docs 与 public/interviewer）。这三个站点在独立的
# 仓库里，所以本工作流需要先跨仓库拉取 admin、docs 与 interviewer 的源码
# 并构建，再把产物放进 public/ 才能编译打包。
#
# 跨仓库拉取 admin、docs 与 interviewer 的源码。
#
# 凭据：优先使用仓库 secret `CROSS_REPO_TOKEN`（可读这三个仓库的 PAT），
# 没配置时回退到默认的 `github.token`。
#   本组织下 admin / docs / interviewer 都是 public 仓库，默认 token 通常也能读取；
#   若将来把这三个仓库改成 private，或者 checkout 报 404，就必须配 PAT：
#     fine-grained -> 选中 admin、docs、interviewer，Contents: Read-only
#     classic      -> 勾选 repo scope
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # 可选：admin / docs / interviewer 构建完成后主动触发后端重建。
  #   在各自的 workflow 里用 peter-evans/repository-dispatch 发事件即可。
  repository_dispatch:
    types: [frontend-updated]

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  PNPM_VERSION: '12.5.1'
  # 打包器默认写 ../dist（本地多仓库工作区的约定），但流水线里
  # $GITHUB_WORKSPACE 就是本仓库根目录，../dist 会落到工作区之外，
  # upload-artifact 只收集工作区内的路径 —— 表现为「打包成功但附件找不到」。
  MZCMC_DIST_DIR: 'dist'

jobs:
  build:
    name: Build with static sites
    runs-on: ubuntu-latest
    steps:
      # 1. 后端自身
      - name: Checkout backend
        uses: actions/checkout@v7

      # 2. 跨仓库拉取管理端、文档站与采访端源码。
      #    注意 admin / docs 目录此时是空的，后面才填充产物。
      - name: Checkout admin
        uses: actions/checkout@v7
        with:
          repository: Smart-MZCMC/admin
          ref: main
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: admin

      - name: Checkout docs
        uses: actions/checkout@v7
        with:
          repository: Smart-MZCMC/docs
          ref: main
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: docs
          fetch-depth: 0

      # 采访端与 admin / docs 一样，产物由后端托管，故在后端流水线内一并构建。
      # 只 checkout 源码，不 checkout 产物：构建结果在下面由 flutter build web 生成。
      - name: Checkout interviewer
        uses: actions/checkout@v7
        with:
          repository: Smart-MZCMC/interviewer
          ref: main
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: interviewer

      # 跨仓库 checkout 失败时给出可操作提示，避免只看到一句 404。
      - name: Verify cross-repo checkouts
        run: |
          set -e
          for dir in admin docs; do
            if [ ! -f "$dir/package.json" ]; then
              echo "::error::拉取 $dir 失败。请为本仓库配置 CROSS_REPO_TOKEN（可读 Smart-MZCMC/$dir 的 PAT）。"
              exit 1
            fi
          done
          # 采访端是 Flutter 工程，用 pubspec.yaml 判断源码是否就位。
          if [ ! -f "interviewer/pubspec.yaml" ]; then
            echo "::error::拉取 interviewer 失败。请为本仓库配置 CROSS_REPO_TOKEN（可读 Smart-MZCMC/interviewer 的 PAT）。"
            exit 1
          fi
          echo "admin / docs / interviewer 源码就位"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # 必须显式给 version。
      #
      # pnpm/action-setup 不会「回退到最新版」：它只认 version 输入，或
      # $GITHUB_WORKSPACE/package.json（工作区根目录）里的 packageManager /
      # devEngines 字段。本仓库根目录没有 package.json，两者皆无就直接报
      # "No pnpm version is specified"。
      #
      # 注意它只看根目录，不会递归扫子目录，所以 docs/package.json 的
      # packageManager 不会与 version 冲突（也就不会触发 "Multiple versions of
      # pnpm specified"）。但这不代表可以随便填一个版本：docs/package.json 里
      # 钉的是 pnpm@12.5.1，pnpm 自身在 manage-package-manager-versions 下会
      # 为它自动切换版本，CI 里若钉 10 就得多下一次 pnpm。所以这里与它保持
      # 一致。实测 admin / docs 两个 lockfile（lockfileVersion 9.0）都能被
      # 12.5.1 用 --frozen-lockfile 原样消费。
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. 构建管理端静态站点
      - name: Build admin
        working-directory: admin
        run: |
          pnpm install
          pnpm run build

      # 4. 构建文档站
      - name: Build docs
        working-directory: docs
        run: |
          pnpm install
          pnpm run docs:build

      # 5. 构建采访端 Flutter Web
      #    channel 用 stable：interviewer/pubspec.lock 要求 flutter >= 3.44.0。
      #    与 admin / docs 构建互不依赖，放在同一 job 内串行执行。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build interviewer web
        working-directory: interviewer
        # --base-href /interviewer/  ：应用挂在 /interviewer/ 下。默认是 "/"，
        #   会让所有资源解析到域名根目录并 404 —— 构建不报错，线上直接白屏。
      # --no-web-resources-cdn       ：CanvasKit 默认从 gstatic.com 拉，
      #   校园内网通常没有外网，不加会卡在白屏。走本地 canvaskit/ 目录。
      # 随后 trim-web.mjs 删掉浏览器从不下载的死重（6 个渲染器变体 +
      #   8MB 源映射），39.8MB -> 8.9MB。删除清单是用 resource timing
      #   实测的，不是猜的。
        run: |
          flutter --version
          flutter pub get
          # ci.yml 没有 Resolve version 步骤，给一个明确的开发版占位值。
          # 不能留空：那会让客户端拿到空版本号，与后端一比就误报「版本不一致」。
          flutter build web --release --base-href /interviewer/ --no-web-resources-cdn \
            --dart-define=APP_VERSION=0.0.0-dev
          node trim-web.mjs build/web
      # 6. 把三个站点的产物放进后端静态目录
      - name: Copy static sites into public/
        run: |
          set -e
          rm -rf public/admin public/docs public/interviewer
          mkdir -p public/admin public/docs public/interviewer
          cp -r admin/build/. public/admin/
          cp -r docs/.vitepress/dist/. public/docs/
          cp -r interviewer/build/web/. public/interviewer/

      # 入口文件必须就位，否则后端会托管一个空白站点。
      - name: Verify static sites
        run: |
          set -e
          test -f public/admin/index.html
          test -f public/docs/index.html
          test -f public/docs/404.html
          # 采访端入口 + Flutter 运行时入口产物。
          test -f public/interviewer/index.html
          test -f public/interviewer/main.dart.js
          test -f public/interviewer/flutter_bootstrap.js
          # 采访端的运行期配置。缺了它现场就没法改服务器地址。
          test -f public/interviewer/config.json
          # base-href 配错是「构建通过、线上白屏」，只能在这里拦。
          # 见 interviewer/README.md 的说明。
          grep -q '<base href="/interviewer/"' public/interviewer/index.html \
            || { echo "::error::采访端 base-href 不是 /interviewer/，资源会 404 导致白屏。构建命令缺少 --base-href /interviewer/。"; exit 1; }
          # 断网部署下 CanvasKit 必须走本地，不能依赖 gstatic.com。
          # 注意是 chromium 变体：引擎在 Chrome/Edge 上实际选的是它，
          # 顶层那份 canvaskit/canvaskit.wasm 从未被请求（会被 trim-web.mjs 删掉）。
          test -f public/interviewer/canvaskit/chromium/canvaskit.js \
            || { echo "::error::采访端缺少本地 canvaskit/chromium，断网部署会白屏。构建命令缺少 --no-web-resources-cdn，或未执行 trim-web.mjs。"; exit 1; }
          # 中文与拉丁字体必须自带：否则会去 fonts.gstatic.com 拉，
          # 断网时请求挂到超时，就是「首屏等十多秒」的来源。
          test -f public/interviewer/assets/assets/fonts/NotoSansSC-Subset.ttf \
            || { echo "::error::采访端缺少中文字体子集，会去 gstatic.com 拉字体并挂起。"; exit 1; }
          echo "admin       files: $(find public/admin -type f | wc -l)"
          echo "docs        files: $(find public/docs -type f | wc -l)"
          echo "interviewer files: $(find public/interviewer -type f | wc -l)"

      - name: Download Go modules
        run: go mod download

      # go vet 能抓到编译级别的问题（未使用变量、格式串错误等）。
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o smart-mzcmc-linux-amd64 .

      # 打包统一走 tools/package.go，不在这里另写一份。
      #
      # 之前 CI 自己 tar 了一遍，产物和本地 `go run ./tools` 打的不是同一个东西：
      #   - tar 时没有顶层目录，部署命令得改成 `tar -xzf ... && cd` 之外的处理
      #   - 漏了 DEPLOY.md / start.sh / smart-mzcmc.service
      #   - 运行期目录没有 .keep 占位，解压后 database/ 不存在
      #   - 完全没有产物校验（采访端 base-href、canvaskit、字体子集都查不到）
      # 复用同一个打包器，本地与 CI 的产物才一致，且校验只维护一份。
      - name: Package release bundle
        run: go run ./tools

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: backend-linux-amd64
          path: dist/backend-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

# Air 热更新配置
root = "."
tmp_dir = "tmp"

[build]
  # 构建命令
  cmd = "go build -o ./tmp/main.exe ."
  # 二进制文件路径
  bin = "./tmp/main.exe"
  # 监听的文件扩展名
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  # 忽略的目录
  exclude_dir = ["tmp", "vendor", "node_modules", "database", "public"]
  # 延迟监听（秒）
  delay = 1000

[log]
  # 日志文件
  time = false

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  # 清除 tmp 目录
  clean_on_exit = true
